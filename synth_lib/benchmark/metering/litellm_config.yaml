# LiteLLM proxy config for the bake-off — cheap spike models; the real campaign
# will replace the model ids in campaign.yaml (the model_name entries here are the served aliases).
#
# Custom prices go under model_info, NOT litellm_params: that is the documented location
# (docs.litellm.ai/docs/proxy/custom_pricing), and the litellm_params path is the one where
# cache_read_input_token_cost is silently ignored and cached tokens bill at the full input rate
# (github.com/BerriAI/litellm/issues/27191). A cached-token rate that silently falls back to the full
# input rate overstates an agentic leg's cost several-fold.
model_list:
  - model_name: claude-model
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-opus-5-model
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
  # Alias must be a REAL model id: codex looks its context metadata up by name and
  # logs "Model metadata for <alias> not found" for invented names — cosmetic.
  - model_name: gpt-5
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY
  # The /gemini passthrough does NOT consult this list: it forwards the CLI's URL verbatim to
  # generativelanguage.googleapis.com, so the campaign's `model` (which lands in the URL path)
  # must be a real Google id. Kept in sync anyway, for the /v1 routes and cost attribution.
  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: os.environ/GEMINI_API_KEY
  # engy.ai. OpenAI-compatible route: Bearer auth, /v1 base. The `openai/` prefix selects the API
  # dialect LiteLLM speaks to the endpoint, not the model's vendor.
  # Prices are required — LiteLLM has no built-in entry for these ids, and a missing price is
  # recorded as zero spend, which disables the budget cap without erroring. engy reports cached
  # tokens (prompt_tokens_details.cached_tokens, verified 2026-08-04) and bills them at the cached
  # rate, so the cached rate must be priced here too or the ledger overstates ~3x on agentic
  # traffic. engy.ai/pricing, 2026-08.
  - model_name: engy-glm-5.2
    litellm_params:
      model: openai/glm-5.2
      api_base: https://api.engy.ai/v1
      api_key: os.environ/ENGY_API_KEY
    model_info:
      input_cost_per_token: 0.00000068          # $0.68 / 1M
      output_cost_per_token: 0.0000015          # $1.50 / 1M
      cache_read_input_token_cost: 0.00000018   # $0.18 / 1M
  - model_name: engy-qwen3.6-35b-a3b
    litellm_params:
      model: openai/qwen3.6-35b-a3b
      api_base: https://api.engy.ai/v1
      api_key: os.environ/ENGY_API_KEY
    model_info:
      input_cost_per_token: 0.000000045         # $0.045 / 1M
      output_cost_per_token: 0.0000003          # $0.30 / 1M
      cache_read_input_token_cost: 0.000000015  # $0.015 / 1M
  # Kimi K3, served by engy (their host and quantization, not Moonshot's endpoint — the Vercel
  # AI Gateway route pinned to moonshotai existed briefly, removed after e286761; restore from git
  # history if reference serving is ever needed). engy.ai/pricing 2026-08.
  - model_name: engy-kimi-k3
    litellm_params:
      model: openai/kimi-k3
      api_base: https://api.engy.ai/v1
      api_key: os.environ/ENGY_API_KEY
      # kimi-code sends reasoning_effort; LiteLLM rejects params it cannot vouch for on a custom
      # model unless told to pass them through. engy accepts all effort values (probed 2026-08-05:
      # high/low/max/medium all 200).
      allowed_openai_params: ["reasoning_effort"]
    model_info:
      input_cost_per_token: 0.0000015           # $1.50 / 1M
      output_cost_per_token: 0.0000075          # $7.50 / 1M
      cache_read_input_token_cost: 0.00000015   # $0.15 / 1M
  # GPT-5 via the Vercel AI Gateway (gateway id `openai/gpt-5`), pinned to OpenAI's own hosting.
  # Added 2026-08-10 as the codex escape route: the recreated `main-stable` litellm build drops
  # the terminal event on direct OpenAI Responses-API streams (codex sees "stream closed before
  # response.completed", reconnects, then turn.failed — it kills a codex leg outright).
  # Prices = OpenAI list for gpt-5 (gateway passes them through; a custom-base model has no
  # built-in litellm price and would meter as zero spend otherwise).
  # codex's "Model metadata for <name> not found" warning fires for this alias exactly as it
  # already does for the plain `gpt-5` alias — cosmetic.
  - model_name: gateway-gpt-5
    litellm_params:
      model: openai/openai/gpt-5
      api_base: https://ai-gateway.vercel.sh/v1
      api_key: os.environ/AI_GATEWAY_API_KEY
      extra_body:
        providerOptions:
          gateway:
            only: ["openai"]
    model_info:
      input_cost_per_token: 0.00000125          # $1.25 / 1M
      output_cost_per_token: 0.00001            # $10.00 / 1M
      cache_read_input_token_cost: 0.000000125  # $0.125 / 1M
  # Qwen 3.8 Max via the Vercel AI Gateway, pinned to Alibaba's own hosting (`only` = fail rather
  # than silently switch host; verify the slug on the dashboard for the first call). Vercel
  # dashboard prices 2026-08. cache_creation = Alibaba bills cache WRITES too, unlike the others.
  - model_name: qwen3.8-max
    litellm_params:
      model: openai/alibaba/qwen3.8-max
      api_base: https://ai-gateway.vercel.sh/v1
      api_key: os.environ/AI_GATEWAY_API_KEY
      extra_body:
        providerOptions:
          gateway:
            only: ["alibaba"]
    model_info:
      input_cost_per_token: 0.000002              # $2.00 / 1M
      output_cost_per_token: 0.000006             # $6.00 / 1M
      cache_read_input_token_cost: 0.00000025     # $0.25 / 1M
      cache_creation_input_token_cost: 0.0000025  # $2.50 / 1M

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
