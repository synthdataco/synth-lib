[project]
name = "campaign-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["synth-lib", "numpy>=2.2", "pandas>=2.3"]

[tool.uv.sources]
# rev is substituted by workspace.py with the commit the HOST was installed from, so the agent
# evaluates on the same library the verdict will score with.
synth-lib = { git = "https://github.com/synthdataco/synth-lib", rev = "__HOST_REV__" }
