[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synth_lib"]

# The benchmark subpackage ships non-Python payload the harness needs at runtime: the constitution
# template, the agent workspace scaffold, the sandbox Dockerfile and the proxy configs. Hatchling
# includes package data by default, so no force-include is needed — but a DOTFILE would be lost,
# which is why the scaffold's .gitignore ships as `gitignore.tmpl` and is renamed at workspace
# creation. Verify after any packaging change:
#   uv build && python -m zipfile -l dist/*.whl | grep -E "CAMPAIGN.md.tmpl|Dockerfile|gitignore.tmpl"


[project]
name = "synth-lib"
version = "0.1.0"
description = "Market-data preparation and validator-faithful backtesting for Synth Subnet miners"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "pandas>=2.2",
    "pyarrow>=24.0.0",
    "requests>=2.32",
    "seaborn>=0.13.2",
    "synth-subnet",
    "tenacity>=8.0",
]

# An EXTRA, not a dependency-group: groups are invisible to a consumer that depends on this
# library by git URL, so `synth-lib[benchmark]` is the only way a downstream benchmark repo can
# install what the harness needs. Only what the HARNESS alone needs belongs here — pandas,
# requests and tenacity are imported by the backtester and preparation, so a plain
# `pip install synth-lib` must already have them; they were reaching those modules by luck
# (seaborn pulls pandas transitively), which breaks the day a transitive dep drops them.
[project.optional-dependencies]
benchmark = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 120 to match the code as written. Not every pre-existing file is clean yet, so format what you
# touch rather than reformatting the tree in one go.
[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203"]


[tool.uv.sources]
synth-subnet = { git = "https://github.com/synthdataco/synth-subnet", rev = "0d014cbcec376b28e887403b84025ebf1a89f60e" }
